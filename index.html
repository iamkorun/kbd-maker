<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBD Maker – ทำรูปปุ่มคีย์บอร์ด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
    --accent:#2f6fed; --accent-ink:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Inter,system-ui,sans-serif;}
  main{max-width:760px;margin:0 auto;padding:32px 20px 60px}
  h1{font-size:26px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 24px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  input[type=text]{width:100%;font:500 18px "JetBrains Mono",ui-monospace,monospace;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink)}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2f6fed22}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font:500 13px "JetBrains Mono",monospace;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:20px}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{flex:1;min-width:60px;font:500 13px inherit;font-family:inherit;padding:7px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  input[type=range]{width:100%}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0;cursor:pointer}
  .preview{margin-top:20px;border-radius:12px;border:1px dashed #cfd4dc;min-height:140px;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;
    background-color:#fff;background-image:linear-gradient(45deg,#f0f2f5 25%,transparent 25%),linear-gradient(-45deg,#f0f2f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f0f2f5 75%),linear-gradient(-45deg,transparent 75%,#f0f2f5 75%);
    background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
  .preview img{max-width:100%;height:auto;display:block}
  .actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
  .btn{font:600 15px inherit;font-family:inherit;padding:12px 22px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .status{font-size:14px;color:var(--muted)}
  .status.ok{color:#118a4e}.status.err{color:#c4320a}
  .help{margin-top:20px;font-size:13.5px;color:var(--muted);line-height:1.7}
  .help code{font-family:"JetBrains Mono",monospace;background:#eef0f3;padding:1px 6px;border-radius:5px;color:var(--ink)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .lang{flex:0 0 auto}
  .lang button{min-width:52px}
  footer{margin-top:28px;font-size:13px;color:var(--muted)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>KBD Maker</h1>
    <div class="seg lang" id="lang">
      <button data-v="th">ไทย</button>
      <button data-v="en">EN</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <div class="card">
    <label class="lbl" for="q" data-i18n="keys"></label>
    <input id="q" type="text" value="Ctrl + V" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>

    <div class="opts">
      <div>
        <label class="lbl" data-i18n="style"></label>
        <div class="seg" id="style">
          <button data-v="light" class="on">Light</button>
          <button data-v="dark">Dark</button>
          <button data-v="flat">Flat</button>
          <button data-v="outline">Outline</button>
        </div>
      </div>
      <div>
        <label class="lbl" data-i18n="font"></label>
        <div class="seg" id="font">
          <button data-v="sans" class="on">Sans</button>
          <button data-v="mono">Mono</button>
        </div>
      </div>
      <div>
        <label class="lbl" data-i18n="mouseColor"></label>
        <div class="seg" id="mouseColor">
          <button data-v="mono" class="on" data-i18n="mono"></button>
          <button data-v="blue" data-i18n="blue"></button>
        </div>
      </div>
      <div>
        <label class="lbl" for="size"><span data-i18n="size"></span>: <span id="sizeV">48</span> px</label>
        <input id="size" type="range" min="24" max="120" value="48">
      </div>
      <div>
        <label class="lbl" data-i18n="options"></label>
        <label class="check"><input type="checkbox" id="mac"> <span data-i18n="mac"></span></label>
        <label class="check"><input type="checkbox" id="plus" checked> <span data-i18n="plus"></span></label>
        <label class="check"><input type="checkbox" id="transparent" checked> <span data-i18n="transparent"></span></label>
      </div>
    </div>

    <div class="preview"><img id="out" alt=""></div>

    <div class="actions">
      <button class="btn" id="copy" data-i18n="copy"></button>
      <button class="btn ghost" id="dl" data-i18n="download"></button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="help" data-i18n="help"></div>
  <footer data-i18n="footer"></footer>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const q = $('q'), out = $('out'), statusEl = $('status');
  const state = { style:'light', font:'sans', mouse:'mono' };
  const I18N = {
    th:{
      sub:'พิมพ์ปุ่มที่อยากได้ แล้วกด Copy เพื่อนำรูปไปวางใน Canva, Slides หรือที่ไหนก็ได้',
      keys:'ปุ่มที่ต้องการ', mouseColor:'สีคลิกเมาส์', mono:'ขาวดำ', blue:'น้ำเงิน', style:'สไตล์', font:'ฟอนต์', size:'ขนาด', options:'ตัวเลือก',
      mac:'ใช้สัญลักษณ์ Mac (⌘ ⌥ ⇧)', plus:'แสดงเครื่องหมาย +', transparent:'พื้นหลังโปร่งใส',
      copy:'Copy รูป', download:'ดาวน์โหลด PNG',
      copied:'คัดลอกรูปแล้ว ✓ ไปกด Ctrl + V ใน Canva ได้เลย',
      copyFail:'เบราว์เซอร์ไม่อนุญาตให้ copy รูปตรงนี้ — คลิกขวาที่รูปแล้วเลือก “คัดลอกรูปภาพ” หรือกดดาวน์โหลดแทน',
      empty:'พิมพ์ปุ่มที่ต้องการด้านบน',
      help:'ใช้ <code>+</code> คั่นปุ่มที่กดพร้อมกัน เช่น <code>Ctrl + Shift + Esc</code> และใช้ <code>,</code> คั่นเมื่อกดต่อกันทีละชุด เช่น <code>Ctrl + K, Ctrl + S</code><br>'+
        'คำพิเศษที่รู้จัก: <code>cmd</code> <code>opt</code> <code>alt</code> <code>shift</code> <code>enter</code> <code>esc</code> <code>tab</code> <code>space</code> <code>backspace</code> <code>del</code> <code>up</code> <code>down</code> <code>left</code> <code>right</code> <code>win</code> <code>fn</code><br>'+
        'เมาส์: <code>left click</code> <code>right click</code> <code>middle click</code> <code>scroll</code> (หรือ <code>lclick</code> <code>rclick</code> <code>คลิกซ้าย</code> <code>คลิกขวา</code>)<br>'+
        'ถ้าปุ่ม Copy ใช้ไม่ได้ ให้คลิกขวาที่รูปแล้วเลือก “คัดลอกรูปภาพ” (Copy image) หรือกดดาวน์โหลด PNG แทน',
      footer:'โอเพนซอร์สบน <a href="https://github.com/iamkorun/kbd-maker">GitHub</a>'
    },
    en:{
      sub:'Type the keys you want, then hit Copy and paste the image into Canva, Slides or anywhere else.',
      keys:'Keys', mouseColor:'Mouse click color', mono:'Black & white', blue:'Blue', style:'Style', font:'Font', size:'Size', options:'Options',
      mac:'Use Mac symbols (⌘ ⌥ ⇧)', plus:'Show + signs', transparent:'Transparent background',
      copy:'Copy image', download:'Download PNG',
      copied:'Copied ✓ Now press Ctrl + V in Canva',
      copyFail:'Your browser blocked image copying here. Right-click the image and choose “Copy image”, or download it instead.',
      empty:'Type some keys above',
      help:'Use <code>+</code> between keys pressed together, e.g. <code>Ctrl + Shift + Esc</code>, and <code>,</code> between steps pressed one after another, e.g. <code>Ctrl + K, Ctrl + S</code><br>'+
        'Special names: <code>cmd</code> <code>opt</code> <code>alt</code> <code>shift</code> <code>enter</code> <code>esc</code> <code>tab</code> <code>space</code> <code>backspace</code> <code>del</code> <code>up</code> <code>down</code> <code>left</code> <code>right</code> <code>win</code> <code>fn</code><br>'+
        'Mouse: <code>left click</code> <code>right click</code> <code>middle click</code> <code>scroll</code> (or <code>lclick</code> <code>rclick</code>)<br>'+
        'If Copy does not work, right-click the image and choose “Copy image”, or use Download PNG.',
      footer:'Open source on <a href="https://github.com/iamkorun/kbd-maker">GitHub</a>'
    }
  };
  let lang = 'en';
  try { lang = localStorage.getItem('kbd-lang') || ''; } catch(e){ lang=''; }
  if (!I18N[lang]) lang = (navigator.language||'').toLowerCase().startsWith('th') ? 'th' : 'en';
  const T = k => I18N[lang][k];
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = T(el.dataset.i18n); });
    $('lang').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===lang));
    document.title = lang==='th' ? 'KBD Maker – ทำรูปปุ่มคีย์บอร์ด' : 'KBD Maker – Keyboard shortcut images';
    statusEl.textContent=''; statusEl.className='status';
  }
  $('lang').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    lang=b.dataset.v; try{ localStorage.setItem('kbd-lang',lang); }catch(e){}
    applyLang(); render();
  });
  applyLang();

  $('dl').onclick = ()=>{
    const name = 'kbd-' + (q.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'keys') + '.png';
    const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const presets = ['Ctrl + C','Ctrl + V','Ctrl + Z','Ctrl + Shift + Esc','Alt + Tab','Win + Shift + S','Cmd + Space','Cmd + Shift + 4','Ctrl + K, Ctrl + S','Left Click','Right Click','Ctrl + Left Click','Shift + Right Click','Ctrl + Scroll','Middle Click'];

  const chips = $('chips');
  presets.forEach(p=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=p;
    b.onclick=()=>{ q.value=p; render(); };
    chips.appendChild(b);
  });

  function seg(id,key){
    $(id).querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{
        $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); state[key]=b.dataset.v; render();
      };
    });
  }
  seg('style','style'); seg('font','font'); seg('mouseColor','mouse');
  ['mac','plus','transparent'].forEach(id=>$(id).onchange=render);
  $('size').oninput=()=>{ $('sizeV').textContent=$('size').value; render(); };
  q.oninput=render;

  const names = {
    ctrl:['Ctrl','⌃'], control:['Ctrl','⌃'],
    cmd:['Cmd','⌘'], command:['Cmd','⌘'], meta:['Cmd','⌘'],
    alt:['Alt','⌥'], opt:['Option','⌥'], option:['Option','⌥'],
    shift:['Shift','⇧'], enter:['Enter','↵'], return:['Return','↵'],
    esc:['Esc','esc'], escape:['Esc','esc'], tab:['Tab','⇥'],
    space:['Space','Space'], spacebar:['Space','Space'],
    backspace:['Backspace','⌫'], bksp:['Backspace','⌫'],
    del:['Del','⌦'], delete:['Delete','⌦'], ins:['Ins','Ins'], insert:['Insert','Insert'],
    caps:['Caps Lock','⇪'], capslock:['Caps Lock','⇪'],
    up:['↑','↑'], down:['↓','↓'], left:['←','←'], right:['→','→'],
    win:['Win','Win'], windows:['Win','Win'], super:['Super','Super'], fn:['Fn','fn'],
    home:['Home','↖'], end:['End','↘'], pgup:['PgUp','⇞'], pageup:['PgUp','⇞'], pgdn:['PgDn','⇟'], pagedown:['PgDn','⇟'],
    prtsc:['PrtSc','PrtSc'], printscreen:['PrtSc','PrtSc']
  };
  const mouse = {
    click:'left', leftclick:'left', lclick:'left', lmb:'left', คลิก:'left', คลิกซ้าย:'left',
    rightclick:'right', rclick:'right', rmb:'right', คลิกขวา:'right',
    middleclick:'middle', mclick:'middle', mmb:'middle', คลิกกลาง:'middle',
    scroll:'scroll', wheel:'scroll', mousewheel:'scroll', สกรอลล์:'scroll',
    mouse:'none'
  };
  const MOUSE = '\u0000mouse:';
  function label(tok, mac){
    const k = tok.trim(); const low = k.toLowerCase().replace(/[\s_-]+/g,'');
    if (mouse[low]) return MOUSE + mouse[low];
    if (names[low]) return names[low][mac?1:0];
    if (/^f\d{1,2}$/i.test(k)) return k.toUpperCase();
    if (k.length===1) return k.toUpperCase();
    return k;
  }
  // returns array of combos; each combo = array of key labels
  function parse(str, mac){
    return str.split(',').map(s=>s.trim()).filter(Boolean).map(combo=>{
      const parts = combo.split('+'); const keys=[];
      for (let i=0;i<parts.length;i++){
        const p = parts[i].trim();
        if (p===''){ // literal "+" key, e.g. "Ctrl + +"
          if (i>0 && i<parts.length-1 && parts[i+1].trim()===''){ keys.push('+'); i++; }
          else if (i===parts.length-1 && parts.length>1 && keys.length && keys[keys.length-1]!=='+') { keys.push('+'); }
          continue;
        }
        keys.push(label(p, mac));
      }
      return keys;
    }).filter(c=>c.length);
  }

  const themes = {
    light:{face:'#ffffff', border:'#cfd4dc', edge:'#b9bfc8', text:'#1b1f24', sep:'#7a828e', bg:'#ffffff', depth:.09},
    dark:{face:'#2c3138', border:'#454c56', edge:'#121418', text:'#f2f4f7', sep:'#9aa3ae', bg:'#16181c', depth:.09},
    flat:{face:'#f2f4f7', border:'#d0d5dd', edge:null, text:'#1b1f24', sep:'#7a828e', bg:'#ffffff', depth:0},
    outline:{face:null, border:'#1b1f24', edge:null, text:'#1b1f24', sep:'#1b1f24', bg:'#ffffff', depth:0}
  };

  function rr(ctx,x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function drawMouse(ctx,x,y,w,h,which,t,lw){
    const r = w*0.48, split = y + h*0.42, cx = x + w/2;
    const accent = state.mouse==='mono' ? t.text : (state.style==='dark' ? '#6b9bff' : '#2f6fed');
    // body
    rr(ctx,x,y,w,h,r);
    ctx.fillStyle = t.face || 'rgba(0,0,0,0)'; if (t.face) ctx.fill();
    // highlighted area (clipped to body)
    ctx.save(); rr(ctx,x,y,w,h,r); ctx.clip();
    ctx.fillStyle = accent;
    if (which==='left') ctx.fillRect(x, y, w/2, split-y);
    if (which==='right') ctx.fillRect(cx, y, w/2, split-y);
    ctx.restore();
    // outline + divider lines
    rr(ctx,x,y,w,h,r); ctx.lineWidth=lw; ctx.strokeStyle=t.border; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, split); ctx.lineTo(x+w, split);
    ctx.moveTo(cx, y); ctx.lineTo(cx, split); ctx.stroke();
    // wheel
    const ww = Math.max(3, w*0.16), wh = h*0.2, wy = y + h*0.1;
    rr(ctx, cx-ww/2, wy, ww, wh, ww/2);
    ctx.fillStyle = (which==='middle'||which==='scroll') ? accent : (t.face || (state.style==='dark'?'#16181c':'#ffffff'));
    ctx.fill(); ctx.stroke();
    // scroll arrows
    if (which==='scroll'){
      const a = w*0.14, ay = y + h*0.68; ctx.fillStyle = accent;
      ctx.beginPath(); ctx.moveTo(cx, ay-a*1.3); ctx.lineTo(cx-a, ay-a*0.3); ctx.lineTo(cx+a, ay-a*0.3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, ay+a*1.3); ctx.lineTo(cx-a, ay+a*0.3); ctx.lineTo(cx+a, ay+a*0.3); ctx.closePath(); ctx.fill();
    }
  }

  const canvas = document.createElement('canvas');
  function render(){
    const mac = $('mac').checked, showPlus=$('plus').checked, transparent=$('transparent').checked;
    const size = +$('size').value; const dpr = 2; // export at 2x for sharp results
    const t = themes[state.style];
    const fam = state.font==='mono' ? '"JetBrains Mono", ui-monospace, monospace' : 'Inter, "IBM Plex Sans Thai", system-ui, sans-serif';
    const combos = parse(q.value, mac);
    const ctx = canvas.getContext('2d');

    const H = size, depth = Math.round(H*t.depth), radius = Math.round(H*0.2);
    const fontPx = Math.round(H*0.4), padX = Math.round(H*0.32);
    const gap = Math.round(H*(showPlus?0.16:0.14)), comboGap = Math.round(H*0.45);
    const plusFont = Math.round(H*0.42), margin = Math.round(H*0.18);
    const lw = state.style==='outline' ? Math.max(2,Math.round(H*0.045)) : Math.max(1,Math.round(H*0.025));

    ctx.font = `600 ${fontPx}px ${fam}`;
    const keyW = s => Math.max(H, Math.ceil(ctx.measureText(s).width) + padX*2);
    ctx.font = `500 ${plusFont}px ${fam}`;
    const plusW = Math.ceil(ctx.measureText('+').width);
    ctx.font = `500 ${plusFont}px ${fam}`;
    const commaW = Math.ceil(ctx.measureText(',').width);

    // layout
    let W = 0; const items=[];
    ctx.font = `600 ${fontPx}px ${fam}`;
    combos.forEach((combo,ci)=>{
      if (ci>0){ items.push({t:'comma',x:W}); W += comboGap; }
      combo.forEach((k,ki)=>{
        if (ki>0){ if(showPlus){ W+=gap; items.push({t:'plus',x:W}); W+=plusW+gap; } else W+=gap; }
        if (k.startsWith(MOUSE)){ const w=Math.round(H*0.74); items.push({t:'mouse',x:W,w,s:k.slice(MOUSE.length)}); W+=w; return; }
        const w = keyW(k); items.push({t:'key',x:W,w,s:k}); W+=w;
      });
    });
    if (!combos.length){ out.removeAttribute('src'); out.alt=T('empty'); return; }

    const totalW = W + margin*2 + lw, totalH = H + depth + margin*2 + lw;
    canvas.width = Math.ceil(totalW*dpr); canvas.height = Math.ceil(totalH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,totalW,totalH);
    if (!transparent){ ctx.fillStyle=t.bg; ctx.fillRect(0,0,totalW,totalH); }

    const ox = margin + lw/2, oy = margin + lw/2;
    const midY = oy + H/2;
    items.forEach(it=>{
      if (it.t==='key'){
        const x=ox+it.x, y=oy;
        if (t.edge && depth){ rr(ctx,x,y+depth,it.w,H,radius); ctx.fillStyle=t.edge; ctx.fill(); }
        rr(ctx,x,y,it.w,H,radius);
        if (t.face){ ctx.fillStyle=t.face; ctx.fill(); }
        ctx.lineWidth=lw; ctx.strokeStyle=t.border; ctx.stroke();
        ctx.fillStyle=t.text; ctx.font=`600 ${fontPx}px ${fam}`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(it.s, x+it.w/2, y+H/2+fontPx*0.04);
      } else if (it.t==='mouse'){
        drawMouse(ctx, ox+it.x, oy, it.w, H+depth, it.s, t, lw);
      } else if (it.t==='plus'){
        ctx.fillStyle=t.sep; ctx.font=`500 ${plusFont}px ${fam}`;
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText('+', ox+it.x, midY + depth/2);
      } else if (it.t==='comma'){
        ctx.fillStyle=t.sep; ctx.font=`500 ${plusFont}px ${fam}`;
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(',', ox+it.x + (comboGap-commaW)/2 - comboGap*0.15, midY + depth/2);
      }
    });

    out.src = canvas.toDataURL('image/png');
    out.style.width = totalW+'px';
    out.alt = q.value;
    statusEl.textContent=''; statusEl.className='status';
  }

  $('copy').onclick = async ()=>{
    try{
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
      const blobP = new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png': blobP})]);
      statusEl.textContent=T('copied'); statusEl.className='status ok';
    }catch(e){
      statusEl.textContent=T('copyFail'); statusEl.className='status err';
    }
  };

  const go = ()=>render();
  if (document.fonts && document.fonts.load){
    Promise.all([document.fonts.load('600 20px Inter'),document.fonts.load('600 20px "JetBrains Mono"'),document.fonts.load('500 20px "IBM Plex Sans Thai"')])
      .then(go, go);
    document.fonts.ready.then(go);
  }
  go();
})();
</script>
</body>
</html>
